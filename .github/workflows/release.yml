name: Build and Release Plugin

on:
  push:
    branches: [master]
    paths:
      - '*/**'
      - 'buildin/*/**'
      - 'pom.xml'
  workflow_dispatch:
    inputs:
      modules:
        description: '要重建的模块（逗号分隔，留空则全部重建）'
        required: false
        default: ''

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.changes.outputs.modules }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine modules to build
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT="${{ inputs.modules }}"
            if [ -z "$INPUT" ]; then
              ALL=$(find . -maxdepth 1 -name pom.xml -not -path './pom.xml' -not -path './[.]*' | sed 's|/pom.xml||; s|^\./||' | sort -u | tr '\n' ' ')
              ALL2=$(find buildin -maxdepth 2 -name pom.xml 2>/dev/null | sed 's|/pom.xml||; s|^\./||' | sort -u | tr '\n' ' ')
              ALL="$ALL $ALL2"
            else
              ALL=$(echo "$INPUT" | tr ',' '\n')
            fi
            echo "manual trigger, modules: $ALL"
            MODULES_JSON=$(echo "$ALL" | tr ' ' '\n' | sed '/^$/d' | jq -R -s -c 'split("\n") | map(select(length>0))')
            echo "modules=$MODULES_JSON" >> "$GITHUB_OUTPUT"
          else
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.event.after }}"
            # 全零 SHA 表示首次 push 或基准不可用，回退到 HEAD~1
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              BEFORE="HEAD~1"
            fi
            echo "diff range: $BEFORE .. $AFTER"
            echo "raw diff files:"
            git diff --name-only "$BEFORE" "$AFTER" | head -20
            CHANGED=$(git diff --name-only "$BEFORE" "$AFTER" | grep -oE '^(buildin/[a-zA-Z0-9_-]+|[a-zA-Z0-9_-]+)/' | sed 's|/$||' | sort -u | tr '\n' ' ' | xargs)
            echo "matched dirs: [$CHANGED]"
            if [ -z "$CHANGED" ]; then
              echo "no plugin module changes detected"
              echo "modules=[]" >> "$GITHUB_OUTPUT"
            else
              echo "modules to build: $CHANGED"
              MODULES_JSON=$(echo "$CHANGED" | tr ' ' '\n' | jq -R -s -c 'split("\n") | map(select(length>0))')
              echo "modules=$MODULES_JSON" >> "$GITHUB_OUTPUT"
            fi
          fi

  build:
    needs: detect
    if: needs.detect.outputs.modules != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: ${{ fromJSON(needs.detect.outputs.modules) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Install Yuni3 dependencies
        run: |
          git clone --depth 1 https://github.com/liyuier/Yuni3.git /tmp/yuni3
          cd /tmp/yuni3
          echo "=== Installing yuni-dependency first ==="
          mvn install -f yuni-dependency/pom.xml
          echo "=== Installing parent POM ==="
          mvn install -N
          echo "=== Installing full chain yuni-plugin ==="
          mvn install -pl yuni-plugin -am -DskipTests

      - name: Build ${{ matrix.module }}
        run: mvn package -pl ${{ matrix.module }} -DskipTests -q

      - name: Normalize artifact name
        id: meta
        run: |
          NAME=$(basename ${{ matrix.module }})
          # 将构建产物重命名为 {id}.jar，方便 deploy.sh 按约定 URL 下载
          find ${{ matrix.module }}/target -maxdepth 1 -name '*.jar' | while read jar; do
            cp "$jar" ${{ matrix.module }}/target/${NAME}.jar
          done
          echo "id=$NAME" >> "$GITHUB_OUTPUT"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.id }}
          files: ${{ matrix.module }}/target/${{ steps.meta.outputs.id }}.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
