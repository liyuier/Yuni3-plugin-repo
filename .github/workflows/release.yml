name: Build and Release Plugin

on:
  push:
    branches: [master]
    paths:
      - '*/**'
      - 'buildin/*/**'
      - 'pom.xml'
  workflow_dispatch:
    inputs:
      modules:
        description: '要重建的模块（逗号分隔，留空则全部重建）'
        required: false
        default: ''

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.changes.outputs.modules }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine modules to build
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT="${{ inputs.modules }}"
            if [ -z "$INPUT" ]; then
              # 从 pom.xml <modules> 读取全量插件列表
              ALL=$(xmlstarlet sel -N x=http://maven.apache.org/POM/4.0.0 -t -v "//x:modules/x:module" pom.xml 2>/dev/null | tr '\n' ' ')
              if [ -z "$ALL" ]; then
                # fallback: 用 grep 解析 modules
                ALL=$(sed -n '/<modules>/,/<\/modules>/p' pom.xml | grep '<module>' | sed 's/.*<module>//;s/<\/module>.*//' | tr '\n' ' ')
              fi
            else
              ALL=$(echo "$INPUT" | tr ',' '\n')
            fi
            echo "all modules: $ALL"
            MODULES_JSON=$(echo "$ALL" | tr ' ' '\n' | sed '/^$/d' | jq -R -s -c 'split("\n") | map(select(length>0))')
            echo "modules=$MODULES_JSON" >> "$GITHUB_OUTPUT"
          else
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.event.after }}"
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              BEFORE="HEAD~1"
            fi
            # 从 pom.xml 取全量列表，再与 git diff 交集
            ALL_MODS=$(sed -n '/<modules>/,/<\/modules>/p' pom.xml | grep '<module>' | sed 's/.*<module>//;s/<\/module>.*//' | tr '\n' ' ')
            CHANGED_DIRS=$(git diff --name-only "$BEFORE" "$AFTER" | grep -oE '^(buildin/[a-zA-Z0-9_-]+|[a-zA-Z0-9_-]+)/' | sed 's|/$||' | sort -u | tr '\n' ' ' | xargs)
            if [ -z "$CHANGED_DIRS" ]; then
              echo "no plugin module changes detected"
              echo "modules=[]" >> "$GITHUB_OUTPUT"
            else
              # 只构建同时出现在 ALL_MODS 和 CHANGED_DIRS 中的模块
              FILTERED=""
              for m in $ALL_MODS; do
                for d in $CHANGED_DIRS; do
                  [ "$m" = "$d" ] && FILTERED="$FILTERED $m"
                done
              done
              echo "changed: $FILTERED"
              MODULES_JSON=$(echo "$FILTERED" | tr ' ' '\n' | sed '/^$/d' | jq -R -s -c 'split("\n") | map(select(length>0))')
              echo "modules=$MODULES_JSON" >> "$GITHUB_OUTPUT"
            fi
          fi

  build:
    needs: detect
    if: needs.detect.outputs.modules != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        module: ${{ fromJSON(needs.detect.outputs.modules) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Install Yuni3 dependencies
        run: |
          git clone --depth 1 https://github.com/liyuier/Yuni3.git /tmp/yuni3
          cd /tmp/yuni3
          mvn install -f yuni-dependency/pom.xml -q
          mvn install -N -q
          mvn install -pl yuni-plugin -am -DskipTests -q

      - name: Build ${{ matrix.module }}
        run: |
          # 在 plugin-repo 上层创建 plugins/ 目录，POM 的 ../../plugins/{id} 指向这里
          mkdir -p ../plugins
          mvn package -pl ${{ matrix.module }} -DskipTests -q

      - name: Package plugin artifact
        id: meta
        run: |
          MODULE="${{ matrix.module }}"
          ID=$(basename "$MODULE")
          PKG_DIR="/tmp/pkg/$ID"
          mkdir -p "$PKG_DIR"

          # JAR — 取主构件（排除 sources/javadoc 及同名拷贝）
          find "$MODULE/target" -maxdepth 1 -name '*.jar' \
            -not -name '*-sources.jar' -not -name '*-javadoc.jar' \
            -not -name "${ID}.jar" | while read jar; do
            cp "$jar" "$PKG_DIR/${ID}.jar"
          done

          # 资源文件、metadata.json — 从 POM 构建产出的 ../../plugins/{id}/ 取
          RES_DIR="../plugins/$ID"
          if [ -d "$RES_DIR" ]; then
            cp -r "$RES_DIR"/* "$PKG_DIR/" 2>/dev/null || true
          fi

          echo "=== Package contents ==="
          ls -la "$PKG_DIR/"

          # 打包为 zip（部署端直接 unzip 到 plugins/{id}/）
          cd /tmp/pkg
          zip -r "$ID.zip" "$ID/"
          echo "zip=/tmp/pkg/$ID.zip"

          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.id }}
          files: /tmp/pkg/${{ steps.meta.outputs.id }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
