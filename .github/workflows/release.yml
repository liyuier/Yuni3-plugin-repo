name: Build and Release Plugin

on:
  push:
    branches: [master]
    paths:
      - '*/**'
      - 'buildin/*/**'
      - 'pom.xml'
  workflow_dispatch:
    inputs:
      modules:
        description: '要重建的模块（逗号分隔，留空则全部重建）'
        required: false
        default: ''

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.changes.outputs.modules }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'push' && 2 || 1 }}

      - name: Determine modules to build
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT="${{ inputs.modules }}"
            if [ -z "$INPUT" ]; then
              # 未指定则构建所有包含 pom.xml 的模块
              ALL=$(find . -name pom.xml -not -path './pom.xml' | sed 's|/pom.xml||; s|^\./||' | sort -u | tr '\n' ' ')
            else
              ALL=$(echo "$INPUT" | tr ',' ' ')
            fi
            echo "manual trigger, modules: $ALL"
            echo "modules=$(echo "$ALL" | jq -R -s -c 'split(" ") | map(select(length>0))')"
            echo "modules=$(echo "$ALL" | jq -R -s -c 'split(" ") | map(select(length>0))')" >> "$GITHUB_OUTPUT"
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD | grep -oE '^(buildin/[^/]+|[^/]+)/' | sed 's|/$||' | sort -u | tr '\n' ' ')
            if [ -z "$CHANGED" ]; then
              echo "no changes detected"
              echo "modules=[]" >> "$GITHUB_OUTPUT"
            else
              echo "changed: $CHANGED"
              echo "modules=$(echo "$CHANGED" | jq -R -s -c 'split(" ") | map(select(length>0))')"
              echo "modules=$(echo "$CHANGED" | jq -R -s -c 'split(" ") | map(select(length>0))')" >> "$GITHUB_OUTPUT"
            fi
          fi

  build:
    needs: detect
    if: needs.detect.outputs.modules != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: ${{ fromJSON(needs.detect.outputs.modules) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Install Yuni3 parent POM
        run: |
          git clone --depth 1 https://github.com/liyuier/Yuni3.git /tmp/yuni3
          cd /tmp/yuni3
          mvn install -pl yuni-dependency -N -q
          mvn install -N -q

      - name: Build ${{ matrix.module }}
        run: mvn package -pl ${{ matrix.module }} -DskipTests -q

      - name: Normalize artifact name
        id: meta
        run: |
          NAME=$(basename ${{ matrix.module }})
          # 将构建产物重命名为 {id}.jar，方便 deploy.sh 按约定 URL 下载
          find ${{ matrix.module }}/target -maxdepth 1 -name '*.jar' | while read jar; do
            cp "$jar" ${{ matrix.module }}/target/${NAME}.jar
          done
          echo "id=$NAME" >> "$GITHUB_OUTPUT"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.id }}
          files: ${{ matrix.module }}/target/${{ steps.meta.outputs.id }}.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
